<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPV Punto Verde | Caja</title>
    <link rel="stylesheet" href="cash.css">
    <link rel="icon" href="icon-192.png">
</head>
<body>

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-card">
            <h2>🌿 TPV Punto Verde</h2>
            <p>Gestión de Caja</p>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Correo" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit">Entrar</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="main-app" style="display: none;">
        <header>
            <div class="brand">💰 Gestión de Caja</div>
            <div class="user-info">
                <span id="user-name">Cargando...</span>
                <button class="icon-btn" id="btn-back">← Volver al TPV</button>
                <button class="icon-btn" id="btn-logout">🚪</button>
            </div>
        </header>

        <div class="cash-container">
            <!-- ESTADO DE CAJA -->
            <div class="status-card" id="status-card">
                <h3>Estado de Caja</h3>
                <div id="cash-status">Cargando...</div>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div class="action-buttons" id="action-buttons">
                <!-- Se generan dinámicamente según el estado -->
            </div>

            <!-- MODAL APERTURA -->
            <div id="modal-open" class="modal-overlay">
                <div class="modal-content">
                    <h3>Abrir Caja</h3>
                    <div class="input-group">
                        <label>Fondo inicial ($):</label>
                        <input type="number" id="opening-fund" placeholder="0" step="0.01">
                    </div>
                    <button class="btn-primary" id="btn-confirm-open">Confirmar Apertura</button>
                    <button class="btn-secondary" onclick="closeModal('modal-open')">Cancelar</button>
                </div>
            </div>

            <!-- MODAL MOVIMIENTO -->
            <div id="modal-movement" class="modal-overlay">
                <div class="modal-content">
                    <h3>Registrar Movimiento</h3>
                    <div class="input-group">
                        <label>Tipo:</label>
                        <select id="movement-type">
                            <option value="entrada">Entrada</option>
                            <option value="salida">Salida</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Método:</label>
                        <select id="movement-method">
                            <option value="efectivo">Efectivo</option>
                            <option value="tarjeta">Tarjeta</option>
                            <option value="bizum">Bizum</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Importe ($):</label>
                        <input type="number" id="movement-amount" placeholder="0" step="0.01">
                    </div>
                    <div class="input-group">
                        <label>Nota:</label>
                        <input type="text" id="movement-note" placeholder="Concepto">
                    </div>
                    <button class="btn-primary" id="btn-confirm-movement">Registrar</button>
                    <button class="btn-secondary" onclick="closeModal('modal-movement')">Cancelar</button>
                </div>
            </div>

            <!-- MODAL ARQUEO CIEGO -->
            <div id="modal-count" class="modal-overlay">
                <div class="modal-content">
                    <h3>Arqueo Ciego - Contar Efectivo</h3>
                    <div class="count-grid">
                        <div class="count-item">
                            <label>Billetes de $100.000:</label>
                            <input type="number" class="bill-count" data-value="100000" placeholder="0">
                        </div>
                        <div class="count-item">
                            <label>Billetes de $50.000:</label>
                            <input type="number" class="bill-count" data-value="50000" placeholder="0">
                        </div>
                        <div class="count-item">
                            <label>Billetes de $20.000:</label>
                            <input type="number" class="bill-count" data-value="20000" placeholder="0">
                        </div>
                        <div class="count-item">
                            <label>Billetes de $10.000:</label>
                            <input type="number" class="bill-count" data-value="10000" placeholder="0">
                        </div>
                        <div class="count-item">
                            <label>Billetes de $5.000:</label>
                            <input type="number" class="bill-count" data-value="5000" placeholder="0">
                        </div>
                        <div class="count-item">
                            <label>Billetes de $2.000:</label>
                            <input type="number" class="bill-count" data-value="2000" placeholder="0">
                        </div>
                        <div class="count-item">
                            <label>Billetes de $1.000:</label>
                            <input type="number" class="bill-count" data-value="1000" placeholder="0">
                        </div>
                        <div class="count-item">
                            <label>Monedas varias:</label>
                            <input type="number" class="bill-count" data-value="1" placeholder="0">
                        </div>
                    </div>
                    <div class="count-total">
                        <span>Total contado:</span>
                        <span id="counted-total">$0</span>
                    </div>
                    <button class="btn-primary" id="btn-confirm-count">Confirmar Arqueo</button>
                    <button class="btn-secondary" onclick="closeModal('modal-count')">Cancelar</button>
                </div>
            </div>

            <!-- REPORTE -->
            <div class="report-section" id="report-section" style="display: none;">
                <h3>Reporte de Caja</h3>
                <div id="report-content"></div>
                <button class="btn-secondary" id="btn-print-report">🖨️ Imprimir Reporte</button>
            </div>
        </div>
    </div>

    <div id="ticket-print-area"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="cash.js"></script>
</body>
</html>
