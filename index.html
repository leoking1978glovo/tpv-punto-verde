<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPV Punto Verde | Caja</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
</head>
<body>

    <!-- OVERLAY DE LOGIN -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-card">
            <div class="login-header">
                <h2>🌿 TPV Punto Verde</h2>
                <p>Inicia sesión para continuar</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="login-email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="login-btn">Entrar</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL (Oculta hasta hacer login) -->
    <div id="main-app" style="display: none;">
        <header>
            <div class="brand">🌿 TPV Punto Verde</div>
            <div class="user-info">
                <span id="user-name">Cargando...</span>
                <span class="badge" id="user-role">Caja</span>
                <button class="icon-btn" id="btn-logout" title="Cerrar sesión">🚪</button>
            </div>
        </header>

        <div class="main-container">
            <div class="products-section">
                <div class="categories" id="categories-bar">
                    <button class="cat-btn active" data-cat="all">Todos</button>
                </div>
                <div class="product-grid" id="product-grid"></div>
            </div>

            <div class="cart-section">
                <div class="cart-header">
                    <span>Pedido Actual</span>
                    <span class="clear-btn" id="btn-clear">🗑️ Limpiar</span>
                </div>
                <div class="cart-items" id="cart-items">
                    <div class="empty-cart">Añade productos para empezar</div>
                </div>
                <div class="cart-footer">
                    <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0</span></div>
                    <div class="summary-row"><span>IVA</span><span id="tax">$0</span></div>
                    <div class="summary-row total"><span>TOTAL</span><span id="total">$0</span></div>
                    <button class="pay-btn" id="btn-pay">COBRAR ($0)</button>
                </div>
            </div>
        </div>

        <!-- Panel de pedidos activos -->
        <div class="active-orders-panel" id="active-orders-panel">
            <div class="panel-header">
                <h3>📋 Pedidos en Curso</h3>
                <button class="close-panel" id="btn-close-panel">✕</button>
            </div>
            <div class="active-orders-list" id="active-orders-list"></div>
        </div>

        <button class="floating-btn" id="btn-active-orders">
            📋 <span class="badge-count" id="badge-count">0</span>
        </button>

        <!-- Modal de Cobro -->
        <div id="pay-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Finalizar Pedido</h2>
                    <button class="close-btn" id="btn-close-modal"></button>
                </div>
                <div class="modal-body">
                    <div class="order-summary">
                        <h3>Resumen</h3>
                        <div id="modal-cart-items"></div>
                        <div class="modal-totals">
                            <div class="summary-row"><span>Subtotal</span><span id="modal-subtotal">$0</span></div>
                            <div class="summary-row"><span>IVA</span><span id="modal-tax">$0</span></div>
                            <div class="summary-row total"><span>TOTAL</span><span id="modal-total">$0</span></div>
                        </div>
                    </div>
                    <div class="order-type">
                        <h3>Tipo de Pedido</h3>
                        <div class="type-buttons">
                            <button class="type-btn active" data-type="mostrador">🏪 Mostrador</button>
                            <button class="type-btn" data-type="recogida">📦 Recogida</button>
                            <button class="type-btn" data-type="domicilio">🛵 Domicilio</button>
                        </div>
                    </div>
                    <div class="payment-method">
                        <h3>Método de Pago</h3>
                        <div class="method-buttons">
                            <button class="method-btn active" data-method="efectivo">💵 Efectivo</button>
                            <button class="method-btn" data-method="tarjeta">💳 Tarjeta</button>
                            <button class="method-btn" data-method="bizum">📱 Bizum</button>
                        </div>
                    </div>
                    <div class="cash-input" id="cash-section">
                        <label>Efectivo recibido:</label>
                        <input type="number" id="cash-received" placeholder="0" step="0.01">
                        <div class="change-display">
                            <span>Cambio:</span>
                            <span id="change-amount" class="change-amount">$0</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="cancel-btn" id="btn-cancel-pay">Cancelar</button>
                    <button class="confirm-btn" id="btn-confirm-pay">✓ Confirmar Pago</button>
                </div>
            </div>
        </div>

        <div class="toast" id="toast"></div>
        <div id="ticket-print-area"></div>
    </div>

    <!-- Librerías externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
