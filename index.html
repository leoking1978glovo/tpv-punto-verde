<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPV Punto Verde | Caja</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
</head>
<body>

    <header>
        <div class="brand">🌿 TPV Punto Verde</div>
        <div class="user-info">
            <span id="user-name">Cargando...</span>
            <span class="badge" id="user-role">—</span>
            <button class="icon-btn" id="btn-settings">⚙️</button>
        </div>
    </header>

    <div class="main-container">
        <!-- PRODUCTOS -->
        <div class="products-section">
            <div class="categories" id="categories-bar">
                <button class="cat-btn active" data-cat="all">Todos</button>
            </div>
            <div class="product-grid" id="product-grid">
                <!-- Se inyecta con JS -->
            </div>
        </div>

        <!-- CARRITO -->
        <div class="cart-section">
            <div class="cart-header">
                <span>Pedido Actual</span>
                <span class="clear-btn" id="btn-clear">🗑️ Limpiar</span>
            </div>
            <div class="cart-items" id="cart-items">
                <div class="empty-cart">Añade productos para empezar</div>
            </div>
            <div class="cart-footer">
                <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0</span></div>
                <div class="summary-row"><span>IVA</span><span id="tax">$0</span></div>
                <div class="summary-row total"><span>TOTAL</span><span id="total">$0</span></div>
                <button class="pay-btn" id="btn-pay">COBRAR ($0)</button>
            </div>
        </div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
