<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de ticket | Restaurante Punto Verde</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0fdf4; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .card { background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 420px; width: 100%; padding: 2rem; text-align: center; }
        .ok { color: #059669; font-size: 3rem; }
        .bad { color: #dc2626; font-size: 3rem; }
        h1 { color: #065f46; font-size: 1.3rem; margin: 0.5rem 0 1rem; }
        .row { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid #e5e7eb; font-size: 0.9rem; }
        .row span:last-child { font-weight: 700; }
        .hash { font-size: 0.65rem; color: #6b7280; word-break: break-all; background: #f9fafb; padding: 0.5rem; border-radius: 6px; margin-top: 1rem; text-align: left; }
        .badge { display: inline-block; padding: 0.2rem 0.8rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; margin-top: 0.5rem; }
        .badge.emitida { background: #d1fae5; color: #065f46; }
        .badge.anulada { background: #fee2e2; color: #991b1b; }
        .foot { margin-top: 1.5rem; font-size: 0.75rem; color: #9ca3af; }
    </style>
<base target="_blank">
</head>
<body>
    <div class="card" id="result">⏳ Verificando ticket…</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://tjohhybyvfqqjummuedk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_B6wSHIVowVjWL_086rafEA_g7-STvzI';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const num = new URLSearchParams(location.search).get('n');
        const box = document.getElementById('result');

        function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

        (async () => {
            if (!num) {
                box.innerHTML = '<div class="bad">❌</div><h1>Falta el número de ticket</h1>';
                return;
            }
            const { data, error } = await sb.from('invoices')
                .select('invoice_number, invoice_date, total, subtotal, iva_amount, invoice_type, status, current_hash, previous_hash')
                .eq('invoice_number', num).maybeSingle();
            if (error || !data) {
                box.innerHTML = '<div class="bad">❌</div><h1>Ticket no encontrado</h1><p style="color:#6b7280;font-size:0.85rem;">El ticket <strong>' + esc(num) + '</strong> no existe en el registro de facturación.</p>';
                return;
            }
            const anulada = data.status === 'anulada';
            box.innerHTML = `
                <div class="${anulada ? 'bad' : 'ok'}">${anulada ? '⚠️' : '✅'}</div>
                <h1>${anulada ? 'Ticket ANULADO' : 'Ticket VERIFICADO'}</h1>
                <p style="color:#6b7280;font-size:0.8rem;margin-bottom:1rem;">Registro de facturación Verifactu (RD 2549/2014)</p>
                <div style="text-align:left;">
                    <div class="row"><span>Número</span><span>${esc(data.invoice_number)}</span></div>
                    <div class="row"><span>Fecha</span><span>${new Date(data.invoice_date).toLocaleString('es-ES')}</span></div>
                    <div class="row"><span>Base imponible</span><span>${Number(data.subtotal).toFixed(2)} €</span></div>
                    <div class="row"><span>IVA</span><span>${Number(data.iva_amount).toFixed(2)} €</span></div>
                    <div class="row"><span>TOTAL</span><span>${Number(data.total).toFixed(2)} €</span></div>
                </div>
                <span class="badge ${esc(data.status)}">${esc(data.status).toUpperCase()}</span>
                <div class="hash"><strong>Firma:</strong> ${esc(data.current_hash)}<br><strong>Anterior:</strong> ${esc(data.previous_hash)}</div>
                <div class="foot">🌿 Restaurante Punto Verde · Verificación segura en la sede del emisor</div>`;
        })();
    </script>
</body>
</html>
