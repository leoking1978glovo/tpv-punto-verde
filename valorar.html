<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valora tu pedido · Restaurante Punto Verde</title>
    <meta name="theme-color" content="#FF6B35">
    <link rel="icon" href="icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #FF6B35, #F7C137); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; border-radius: 22px; padding: 34px 28px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25); }
        h1 { font-size: 19px; color: #0A0A0A; margin-bottom: 2px; }
        .sub { font-size: 13px; color: #7A7468; margin-bottom: 22px; }
        .btns { display: flex; gap: 14px; margin-bottom: 8px; }
        .vote { flex: 1; padding: 22px 8px; border-radius: 16px; border: 2.5px solid #E8E2D6; background: #FAFAFA; font-size: 40px; cursor: pointer; transition: .15s; }
        .vote small { display: block; font-size: 13px; font-weight: 700; margin-top: 6px; color: #7A7468; }
        .vote.up.sel { border-color: #FF6B35; background: #FFF0E6; }
        .vote.down.sel { border-color: #c0392b; background: #fbe9e7; }
        textarea { width: 100%; padding: 13px; border: 2px solid #E8E2D6; border-radius: 12px; font-size: 14px; margin-top: 14px; resize: none; font-family: inherit; }
        textarea:focus { outline: none; border-color: #FF6B35; }
        button.send { width: 100%; padding: 15px; margin-top: 14px; background: #0A0A0A; color: #F7C137; border-radius: 12px; font-weight: 800; font-size: 15px; border: none; cursor: pointer; }
        button.send:disabled { opacity: .4; cursor: not-allowed; }
        .thanks { display: none; }
        .thanks .big { font-size: 52px; margin-bottom: 10px; }
        .err { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }
    </style>
<base target="_blank">
</head>
<body>
    <div class="card" id="step1">
        <h1>¿Cómo estuvo todo?</h1>
        <p class="sub">Tu opinión nos ayuda a mejorar</p>
        <div class="btns">
            <button class="vote up" id="up">👍<small>Muy bien</small></button>
            <button class="vote down" id="down">👎<small>Mejoraría</small></button>
        </div>
        <textarea id="comment" rows="3" placeholder="Cuéntanos más (opcional)"></textarea>
        <button class="send" id="send">Enviar valoración</button>
        <p class="err" id="err">No se pudo enviar. Inténtalo de nuevo.</p>
    </div>
    <div class="card thanks" id="step2">
        <div class="big">🎉</div>
        <h1>¡Gracias!</h1>
        <p class="sub">Tu valoración ha sido registrada.<br>🌿 Restaurante Punto Verde</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://tjohhybyvfqqjummuedk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_B6wSHIVowVjWL_086rafEA_g7-STvzI';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const orderId = new URLSearchParams(location.search).get('p');
        let rating = null;

        document.getElementById('up').onclick = () => { rating = 'up'; paint(); };
        document.getElementById('down').onclick = () => { rating = 'down'; paint(); };
        function paint() {
            document.getElementById('up').classList.toggle('sel', rating === 'up');
            document.getElementById('down').classList.toggle('sel', rating === 'down');
        }

        document.getElementById('send').onclick = async () => {
            if (!rating) return;
            if (!orderId) { document.getElementById('err').style.display = 'block'; return; }
            const btn = document.getElementById('send');
            btn.disabled = true; btn.textContent = 'Enviando…';
            const { error } = await sb.from('reviews').insert([{
                order_id: parseInt(orderId), rating, comment: document.getElementById('comment').value.trim()
            }]);
            if (error) {
                document.getElementById('err').style.display = 'block';
                btn.disabled = false; btn.textContent = 'Enviar valoración';
                return;
            }
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        };
    </script>
</body>
</html>
